<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Practice Session – Online Exam Questions</title>

  <!-- SEO Meta -->
  <meta name="description" content="Practice exam questions in CBT format. Answer questions, track time, and navigate easily just like JAMB, WAEC, NECO, and SAT exams." />
  <meta name="keywords" content="CBT exam, online practice test, JAMB practice, WAEC CBT, exam questions" />
  <meta name="author" content="Lumini Learning" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Open Graph -->
  <meta property="og:title" content="Practice Session – Exam Mode" />
  <meta property="og:description" content="Answer exam questions with real CBT experience." />
  <meta property="og:type" content="website" />

  <link rel="stylesheet" href="question.css" />
</head>
<body>

<main class="exam-container">

  <!-- Header -->
  <header class="exam-header">
    <span class="back">←</span>
    <h1>Practice Session</h1>
    <span class="progress">Question 1–6 of 50</span>
  </header>

  <!-- Questions -->
  <section class="questions">

    <!-- Question Card -->
    <article class="question-card">
      <h2>Q1. What is the derivative of f(x) = x²?</h2>

      <label class="option">
        <input type="radio" name="q1" />
        <span>A. 6x + 5</span>
      </label>

      <label class="option">
        <input type="radio" name="q1" />
        <span>B. 6x</span>
      </label>

      <label class="option selected">
        <input type="radio" name="q1" checked />
        <span>C. 2x</span>
      </label>
    </article>

    <!-- Duplicate cards as needed -->
    <article class="question-card">
      <h2>Q2. What is the derivative of 3x²?</h2>

      <label class="option">
        <input type="radio" name="q2" />
        <span>A. 6x + 5</span>
      </label>

      <label class="option selected">
        <input type="radio" name="q2" checked />
        <span>B. 6x</span>
      </label>

      <label class="option">
        <input type="radio" name="q2" />
        <span>C. 3x² + 5</span>
      </label>
    </article>

  </section>

  <!-- Question Navigation -->
  <nav class="question-nav" aria-label="Question navigation">
    <button class="nav-btn active">1</button>
    <button class="nav-btn">2</button>
    <button class="nav-btn">3</button>
    <button class="nav-btn">4</button>
    <button class="nav-btn">5</button>
    <button class="nav-btn">6</button>
    <button class="nav-btn">7</button>
    <button class="nav-btn">8</button>
    <button class="nav-btn">9</button>
    <button class="nav-btn">10</button>
  </nav>

  <!-- Footer -->
  <footer class="exam-footer">
    <div class="time">
      ⏱ Time Remaining: <strong>45:32</strong>
    </div>
  </footer>

</main>

</body>
</html>
